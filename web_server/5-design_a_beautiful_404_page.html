
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101014;
            color: #ffffff;
            font-family: 'DM Sans', sans-serif;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            min-height: 580px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        .content {
            flex: 1;
            max-width: 490px;
        }

        .label {
            color: #ef4444;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(100px, 15vw, 170px);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -12px;
            color: #ffffff;
            margin-bottom: 28px;
        }

        h1 span {
            color: #ef4444;
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(25px, 4vw, 36px);
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .description {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.8;
            max-width: 410px;
            margin-bottom: 15px;
        }

        .french {
            color: #ef4444;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 32px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 25px;
            background: #ef4444;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s ease,
                        transform 0.3s ease;
        }

        .button:hover {
            background: #dc2626;
            transform: translateY(-3px);
        }

        .button span {
            font-size: 18px;
        }

        .artwork {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .artwork img {
            display: block;
            width: 100%;
            max-width: 520px;
            height: auto;
            object-fit: contain;
        }

        footer {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #52525b;
            font-size: 11px;
            letter-spacing: 2px;
        }

        @media (max-width: 760px) {
            body {
                padding: 30px 20px 65px;
            }

            .container {
                flex-direction: column-reverse;
                text-align: center;
                gap: 20px;
            }

            .content {
                max-width: 100%;
            }

            .artwork img {
                max-width: 340px;
            }

            h1 {
                font-size: 110px;
                letter-spacing: -8px;
            }

            .description {
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="content">

            <div class="label">Error 404 / Lost in the system</div>

            <h1>4<span>0</span>4</h1>

            <h2>Seriously? This page is gone.</h2>

            <p class="description">
                I've searched everywhere, but this page
                is nowhere to be found. Even Tanjiro is
                running out of patience.
            </p>

            <p class="french">
                Ceci n'est pas une page.
            </p>

            <a href="/" class="button">
                Take me home <span>↗</span>
            </a>

        </section>

        <section class="artwork">
            <img
                src="404-anime.png"
                alt="Tanjiro Kamado looking frustrated"
            >
        </section>

    </main>

    <footer>
        KEEP CALM. EVEN HASHIRA GET LOST.
    </footer>

</body>
</html>
